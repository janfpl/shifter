[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chromatic-shift-corrector"
version = "1.0.0"
description = "Napari-based axial and lateral chromatic shift correction for light sheet microscopy"
requires-python = ">=3.9"
dependencies = [
    "napari[all]>=0.4.18",
    "tifffile>=2023.2.3",
    "dask[array]>=2023.1.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "psutil>=5.9",
    "qtpy>=2.3",
    "scikit-image>=0.20",
    "matplotlib>=3.5",
    "h5py>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
gpu = [
    "cupy-cuda12x",
]

[project.scripts]
chromatic-shift-corrector = "chromatic_shift_corrector.main:main"
