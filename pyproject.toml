[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chromatic-shift-corrector"
version = "1.0.0"
description = "Napari-based axial and lateral chromatic shift correction for light sheet microscopy"
requires-python = ">=3.9"
dependencies = [
    "napari[all]>=0.4.18",
    "tifffile>=2023.2.3",
    "dask[array]>=2023.1.0",
    "numpy>=1.23",
    "scipy>=1.10",
    "psutil>=5.9",
    "qtpy>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
chromatic-shift-corrector = "chromatic_shift_corrector.main:main"
